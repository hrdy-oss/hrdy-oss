<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="HRDY-OSS arcade banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFE600" opacity="0.07"/>
    </pattern>
    <g id="ghost">
      <path d="M-12,12 L-12,-2 A12,12 0 0,1 12,-2 L12,12 L8,8 L4,12 L0,8 L-4,12 L-8,8 Z"/>
      <circle cx="-5" cy="-3" r="3.5" fill="#fff"/><circle cx="5" cy="-3" r="3.5" fill="#fff"/>
      <circle cx="-4" cy="-3" r="1.6" fill="#00f"/><circle cx="6" cy="-3" r="1.6" fill="#00f"/>
    </g>
  </defs>

  <rect width="900" height="260" fill="#000"/>
  <rect width="900" height="260" fill="url(#scan)"/>
  <rect x="6" y="6" width="888" height="248" fill="none" stroke="#FFE600" stroke-width="3" filter="url(#glow)"/>
  <rect x="14" y="14" width="872" height="232" fill="none" stroke="#FFE600" stroke-width="1" opacity="0.5"/>

  <!-- twinkling stars -->
  <g fill="#FFE600">
    <rect x="60" y="40" width="4" height="4"><animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="820" y="55" width="4" height="4"><animate attributeName="opacity" values="0;1;0" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="150" y="190" width="4" height="4"><animate attributeName="opacity" values="1;0;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="740" y="180" width="4" height="4"><animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="450" y="32" width="4" height="4"><animate attributeName="opacity" values="1;0;1" dur="1.9s" repeatCount="indefinite"/></rect>
  </g>

  <!-- HUD -->
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="14" letter-spacing="3">
    <text x="32" y="38" fill="#fff">1UP</text>
    <text x="32" y="56" fill="#FFE600">000420</text>
    <text x="868" y="38" fill="#fff" text-anchor="end">HIGH SCORE</text>
    <text x="868" y="56" fill="#FFE600" text-anchor="end">999999</text>
  </g>

  <!-- title -->
  <text x="450" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="52" letter-spacing="5" fill="#FFE600" filter="url(#glow)">HAFIZ RIYADI
    <animate attributeName="opacity" values="1;1;0.85;1;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="152" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="17" letter-spacing="4" fill="#fff">STUDENT DEVELOPER x FULL STACK ENTHUSIAST</text>
  <text x="450" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" letter-spacing="6" fill="#FFE600">
    * INSERT COIN *
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- pacman lane -->
  <g transform="translate(0,222)">
    <g fill="#FFE600">
      <circle cx="30" cy="0" r="3"/>
      <circle cx="60" cy="0" r="3"/>
      <circle cx="90" cy="0" r="3"/>
      <circle cx="120" cy="0" r="3"/>
      <circle cx="150" cy="0" r="3"/>
      <circle cx="180" cy="0" r="3"/>
      <circle cx="210" cy="0" r="3"/>
      <circle cx="240" cy="0" r="3"/>
      <circle cx="270" cy="0" r="3"/>
      <circle cx="300" cy="0" r="3"/>
      <circle cx="330" cy="0" r="3"/>
      <circle cx="360" cy="0" r="3"/>
      <circle cx="390" cy="0" r="3"/>
      <circle cx="420" cy="0" r="3"/>
      <circle cx="450" cy="0" r="3"/>
      <circle cx="480" cy="0" r="3"/>
      <circle cx="510" cy="0" r="3"/>
      <circle cx="540" cy="0" r="3"/>
      <circle cx="570" cy="0" r="3"/>
      <circle cx="600" cy="0" r="3"/>
      <circle cx="630" cy="0" r="3"/>
      <circle cx="660" cy="0" r="3"/>
      <circle cx="690" cy="0" r="3"/>
      <circle cx="720" cy="0" r="3"/>
      <circle cx="750" cy="0" r="3"/>
      <circle cx="780" cy="0" r="3"/>
      <circle cx="810" cy="0" r="3"/>
      <circle cx="840" cy="0" r="3"/>
      <circle cx="870" cy="0" r="3"/>
    </g>
    <rect x="0" y="-14" width="0" height="28" fill="#000">
      <animate attributeName="width" from="0" to="900" dur="8s" repeatCount="indefinite"/>
    </rect>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-130 0" to="770 0" dur="8s" repeatCount="indefinite"/>
      <use href="#ghost" fill="#00FFFF"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-90 0" to="810 0" dur="8s" repeatCount="indefinite"/>
      <use href="#ghost" fill="#FFB8FF"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-50 0" to="850 0" dur="8s" repeatCount="indefinite"/>
      <use href="#ghost" fill="#FF0000"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="8s" repeatCount="indefinite"/>
      <path fill="#FFE600" transform="scale(0.55)" d="M0,0 L20,-13 A24,24 0 1,0 20,13 Z">
        <animate attributeName="d" values="M0,0 L20,-13 A24,24 0 1,0 20,13 Z;M0,0 L24,-1 A24,24 0 1,0 24,1 Z;M0,0 L20,-13 A24,24 0 1,0 20,13 Z" dur="0.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
